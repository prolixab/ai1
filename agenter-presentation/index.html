<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agenter och miljöer – AI 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Inter+Tight:wght@600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--sans:"Inter","Helvetica Neue",Arial,system-ui,sans-serif;--display:"Inter Tight","Inter","Helvetica Neue",Arial,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace}
.pal-light{--bg:#ffffff;--surface:#f5f5f5;--raised:#ffffff;--ink:#0a0a0a;--muted:#5c5c5c;--subtle:#8a8a8a;--line:#e5e5e5;--ctrl:#8a8a8a;--accent:#2f4bff;--accent-h:#1f36d6;--on-accent:#ffffff;--tint:#eef0ff;--hl:#ff5a1f;--on-hl:#0a0a0a;--shadow:0 1px 2px rgba(10,10,10,.06)}
.pal-dark{--bg:#0a0a0a;--surface:#171717;--raised:#1f1f1f;--ink:#fafafa;--muted:#a3a3a3;--subtle:#6b6b6b;--line:#262626;--ctrl:#6b6b6b;--accent:#7b8cff;--accent-h:#9aa7ff;--on-accent:#0a0a0a;--tint:#161b3d;--hl:#ff6a33;--on-hl:#0a0a0a;--shadow:0 1px 2px rgba(0,0,0,.5)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:24px;transition:background-color .25s;-webkit-font-smoothing:antialiased}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform:translate(-50%,-50%) scale(var(--k,1));transform-origin:center;overflow:hidden;user-select:none}
#slide{position:absolute;inset:0}
.slide{position:absolute;inset:0;padding:52px 72px 84px}
#wipe{position:absolute;left:0;top:0;width:1280px;height:720px;pointer-events:none;z-index:9}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.abs{position:absolute}
canvas{display:block}

/* type */
.ov{font:600 12px/16px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:10px}
.ov::before{content:"";width:8px;height:8px;border-radius:9999px;background:var(--accent);flex:none}
.t{font-family:var(--display);font-weight:600;font-size:44px;line-height:52px;letter-spacing:-.02em;margin:14px 0 0;max-width:1100px;text-wrap:balance}
.t.big{font-size:60px;line-height:64px}
.t.huge{font-size:56px;line-height:62px}
.lead{font-size:22px;line-height:32px;color:var(--muted);margin:18px 0 0;max-width:720px;text-wrap:pretty}
.k{font:600 12px/16px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.h3{font-size:20px;line-height:28px;font-weight:600;margin:6px 0 0}
.p{font-size:17px;line-height:26px;color:var(--muted);margin:6px 0 0}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.acc{color:var(--accent)}
.strong{font-weight:600}
b{font-weight:600}
.hint{font:600 12px/16px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
kbd{font:600 12px var(--mono);border:1px solid var(--ctrl);border-radius:4px;padding:1px 6px;margin:0 2px;color:var(--ink)}

/* entry animation */
.rise{animation:rise .7s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--d,0s)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.fade{animation:fade .8s ease both;animation-delay:var(--d,0s)}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:scale(0)}}

/* svg dots */
svg{overflow:visible;display:block}
.d{fill:var(--ctrl);transform-box:fill-box;transform-origin:center;animation:pop .45s cubic-bezier(.3,1.7,.5,1) both;animation-delay:var(--d,0s);transition:fill .35s,r .35s,opacity .35s}
.edge.tree .d{fill:var(--ink)}
.edge.faint .d{opacity:.3}
.edge.path .d{fill:var(--accent);r:3.7px}
.edge.p1 .d{fill:var(--ink);r:3.7px}
.crow .d{fill:var(--accent);opacity:.55}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .55s cubic-bezier(.3,1.6,.5,1) both;animation-delay:var(--d,0s)}
.node{transition:opacity .35s}
.node .core{fill:var(--bg);stroke:var(--ink);stroke-width:2.5;transition:fill .3s,stroke .3s}
.node .halo{fill:none;stroke:transparent;stroke-width:2;transition:stroke .3s}
.node.dash .core{stroke-dasharray:0 5.4;stroke-linecap:round;stroke-width:3.2}
.node.exp .core{fill:var(--ink);stroke:var(--ink)}
.node.front .core{fill:var(--tint);stroke:var(--accent)}
.node.front .halo{stroke:var(--accent);animation:ring 1.6s ease-in-out infinite}
.node.cur .halo{stroke:var(--hl);stroke-width:3.5;animation:none}
.node.path .core{fill:var(--accent);stroke:var(--accent)}
.node.faint{opacity:.28}
.node .lbl{font:600 15px var(--sans);fill:var(--ink);text-anchor:middle;paint-order:stroke;stroke:var(--bg);stroke-width:6px;stroke-linejoin:round}
.node .in{font:600 19px var(--sans);text-anchor:middle;dominant-baseline:central;fill:var(--ink);transition:fill .3s}
.node.exp .in,.node.path .in{fill:var(--bg)}
.node .tag{font:600 12px var(--mono);fill:var(--muted);text-anchor:middle;paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}
.node .tag.on{fill:var(--accent)}
.badge{opacity:0;transition:opacity .3s}
.node.num .badge{opacity:1}
.badge circle{fill:var(--bg);stroke:var(--ink);stroke-width:1.5}
.badge text{font:600 11px var(--mono);fill:var(--ink);text-anchor:middle;dominant-baseline:central}
@keyframes ring{50%{stroke-opacity:.2}}
.w{font:400 13px var(--mono);fill:var(--muted);text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:var(--bg);stroke-width:6px;stroke-linejoin:round}
.pulse{fill:var(--accent)}
.pulse2{fill:none;stroke:var(--accent);stroke-width:2;opacity:.4}
.ann{font:400 14px var(--sans);fill:var(--muted)}
.ann.s{font-weight:600;fill:var(--ink)}
.dp{fill:none;stroke:var(--ctrl);stroke-width:3.4;stroke-linecap:round;stroke-dasharray:0 9}
.dp.a{stroke:var(--accent)}
.dp.i{stroke:var(--ink)}
.nd{fill:var(--ink)}
.nd.a{fill:var(--accent)}
.reveal .d{animation:none;transform:scale(0)}
.reveal.show .d{transform:none;animation:pop .45s cubic-bezier(.3,1.7,.5,1) both;animation-delay:var(--d,0s)}
.ln{stroke:var(--line);stroke-width:1.4}
.lvl{stroke:var(--line);stroke-width:1.5;stroke-dasharray:0 8;stroke-linecap:round}

/* legend */
.legend{display:flex;gap:20px;flex-wrap:wrap;font-size:14px;line-height:20px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:8px}
.lg{width:14px;height:14px;border-radius:9999px;border:2.5px solid var(--ink);background:var(--bg);display:inline-block}
.lg.exp{background:var(--ink)}
.lg.front{border-color:var(--accent);background:var(--tint)}
.lg.cur{border-color:var(--hl);border-width:3px}
.lg.path{border-color:var(--accent);background:var(--accent)}
.lg.dash{border-style:dotted}
.lg.sub{border:0;background:var(--subtle)}
.lg.line{border:0;background:var(--line)}

/* table */
.tb{border-collapse:collapse;width:100%;font-size:15px;line-height:21px}
.tb th{font:600 12px/16px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 12px;background:var(--surface)}
.tb td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tb td.n{font-family:var(--mono);color:var(--muted);width:34px}
.tb .m{font-family:var(--mono);font-size:14px}
.tb tr.hi td{background:var(--tint)}
.wk tr[data-r]{opacity:0;transition:opacity .35s,background-color .3s}
.wk tr[data-r] td{transition:background-color .3s}
.wk tr.on{opacity:1}
.wk tr.now td{background:var(--tint)}
.q{font-family:var(--mono);font-size:14px;letter-spacing:.06em;color:var(--muted)}
.q b{color:var(--accent)}
.goal{color:var(--accent);font-weight:600}
.dim{color:var(--muted);font-size:13px}
.onfin{opacity:0;transition:opacity .4s,transform .4s;transform:translateY(8px)}
.onfin.on{opacity:1;transform:none}
.stepl{font:600 12px/16px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:14px;display:flex;gap:6px;align-items:center}
.sdots{display:inline-flex;gap:5px;margin-left:8px}
.sdots i{width:7px;height:7px;border-radius:9999px;background:var(--line);transition:background .3s}
.sdots i.on{background:var(--ink)}

/* blocks */
.card{background:var(--raised);border:1px solid var(--line);border-radius:8px;padding:24px}
.band{background:var(--ink);color:var(--bg);border-radius:8px;padding:28px 32px}
.band .k{color:var(--bg);opacity:.75}
.band .p{color:var(--bg);opacity:.8}
.row{display:flex;gap:24px}
.col{display:flex;flex-direction:column}
.chip{display:inline-flex;align-items:center;gap:10px;font-size:16px}
.num{width:36px;height:36px;border-radius:9999px;background:var(--ink);color:var(--bg);display:inline-flex;align-items:center;justify-content:center;font:600 15px var(--mono);flex:none}
.num.a{background:var(--accent);color:var(--on-accent)}
.cell-empty{color:var(--subtle);letter-spacing:.3em}

/* queue/stack */
.lane{position:relative;height:210px;border-radius:8px;background:var(--surface);overflow:hidden}
.qd{position:absolute;left:0;top:0;width:40px;height:40px;border-radius:9999px;background:var(--ink);color:var(--bg);font:600 14px var(--mono);display:flex;align-items:center;justify-content:center;transition:transform .55s cubic-bezier(.3,1.25,.5,1),opacity .45s,background-color .3s}
.qd.next{background:var(--accent);color:var(--on-accent)}
.qd.out{opacity:0;background:var(--accent);color:var(--on-accent)}
.lane .mk{position:absolute;font:600 11px/14px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* agent-specific */
.lead b{color:var(--ink);font-weight:600}
.klab{font:600 12px var(--sans);letter-spacing:.08em;fill:var(--muted)}
.agdot{width:7px;height:7px;border-radius:9999px;background:var(--line);display:inline-block;margin-left:5px;flex:none}
.strip{display:flex;align-items:center;gap:12px;font-size:21px;line-height:28px}
.strip .sw{color:var(--muted);transition:color .3s}
.strip .sw.on{color:var(--accent);font-weight:600}
.strip .ar{color:var(--subtle)}
.dirt circle{fill:var(--muted);transform-box:fill-box;transform-origin:center;transition:transform .35s,opacity .35s}
.dirt.gone circle{transform:scale(0);opacity:0}
.robot{transition:transform .8s cubic-bezier(.5,0,.3,1)}
.qdot{width:14px;height:14px;border-radius:9999px;background:var(--ink);display:inline-block;animation:pop .45s cubic-bezier(.3,1.7,.5,1) both}
.qdot:nth-child(12){background:var(--accent)}
.cta{display:inline-flex;align-items:center;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:18px;padding:12px 22px;border-radius:4px;text-decoration:none}
.cta:hover{background:var(--accent-h)}
.cta:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* progress bar */
#bar{position:absolute;left:72px;right:72px;bottom:26px;height:24px;display:flex;align-items:center;z-index:5}
#sec{flex:1;font:600 12px/16px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
#dots{display:flex;align-items:center;gap:7px}
#dots button{position:relative;width:8px;height:8px;border-radius:9999px;border:0;padding:0;background:var(--subtle);opacity:.4;cursor:pointer;transition:width .35s cubic-bezier(.3,1.3,.5,1),background-color .35s,opacity .35s}
#dots button::after{content:"";position:absolute;inset:-8px -4px}
#dots button.gap{margin-left:12px}
#dots button.past{background:var(--ink);opacity:1}
#dots button.now{width:26px;background:var(--accent);opacity:1}
#dots button:hover{opacity:1}
#right{flex:1;display:flex;justify-content:flex-end;align-items:center;gap:6px}
#count{font:400 13px var(--mono);color:var(--muted);min-width:64px;text-align:center}
.nb{width:28px;height:28px;border-radius:4px;border:1px solid var(--ctrl);background:transparent;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0}
.nb:hover{background:var(--surface)}
.nb svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body class="pal-light">
<div id="stage" aria-live="polite">
  <div id="slide"></div>
  <nav id="bar" aria-label="Bildnavigering">
    <div id="sec"></div>
    <div id="dots"></div>
    <div id="right">
      <a class="nb" href="../" title="Till kurssidan AI 1" aria-label="Till kurssidan AI 1"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7M6 9.5V20h12V9.5"/></svg></a>
      <button class="nb" id="theme" title="Byt ljust/mörkt tema (T)" aria-label="Byt tema"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor"/></svg></button>
      <button class="nb" id="prev" aria-label="Föregående"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
      <span id="count">01 / 19</span>
      <button class="nb" id="next" aria-label="Nästa"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>
  </nav>
  <canvas id="wipe"></canvas>
</div>
<script>
(()=>{
"use strict";
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let K=1;
const cssv=n=>getComputedStyle(document.body).getPropertyValue(n).trim();
const fmt=n=>n.toLocaleString('sv-SE');

/* ---------- helpers ---------- */
function setup(cv,w,h){const R=(window.devicePixelRatio||1)*Math.max(K,.5);cv.width=Math.round(w*R);cv.height=Math.round(h*R);cv.style.width=w+'px';cv.style.height=h+'px';const x=cv.getContext('2d');x.setTransform(R,0,0,R,0,0);return x;}
function loop(el,fn){let id,t0=performance.now();const f=t=>{if(!el.isConnected)return;fn(t-t0,t);id=requestAnimationFrame(f)};id=requestAnimationFrame(f);return()=>cancelAnimationFrame(id);}
function dots(x1,y1,x2,y2,o={}){const gap=o.gap||12,r=o.r||2.4,dl=o.delay||0,st=o.step??.016;const L=Math.hypot(x2-x1,y2-y1);const n=Math.max(1,Math.round(L/gap));let s='';for(let i=0;i<=n;i++){const t=i/n;s+=`<circle class="d" cx="${(x1+(x2-x1)*t).toFixed(1)}" cy="${(y1+(y2-y1)*t).toFixed(1)}" r="${r}" style="--d:${(dl+i*st).toFixed(3)}s"/>`;}return s;}
function qdots(x1,y1,cx,cy,x2,y2,o={}){const gap=o.gap||12,r=o.r||2.4,dl=o.delay||0,st=o.step??.016;let L=0,px=x1,py=y1;for(let i=1;i<=50;i++){const t=i/50,x=(1-t)*(1-t)*x1+2*(1-t)*t*cx+t*t*x2,y=(1-t)*(1-t)*y1+2*(1-t)*t*cy+t*t*y2;L+=Math.hypot(x-px,y-py);px=x;py=y;}const n=Math.round(L/gap);let s='';for(let i=0;i<=n;i++){const t=i/n,x=(1-t)*(1-t)*x1+2*(1-t)*t*cx+t*t*x2,y=(1-t)*(1-t)*y1+2*(1-t)*t*cy+t*t*y2;s+=`<circle class="d" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}" style="--d:${(dl+i*st).toFixed(3)}s"/>`;}return s;}
const ek=(a,b)=>[a,b].sort().join('');
function pulse(svg,pts){$$('.pulse,.pulse2',svg).forEach(n=>n.remove());if(!pts||pts.length<2)return;let L=0;for(let i=1;i<pts.length;i++)L+=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);const d='M'+pts.map(p=>p.join(' ')).join(' L');const dur=(Math.max(1.6,L/170)).toFixed(2);svg.insertAdjacentHTML('beforeend',`<circle class="pulse2" r="11"><animateMotion dur="${dur}s" repeatCount="indefinite" path="${d}"/></circle><circle class="pulse" r="6"><animateMotion dur="${dur}s" repeatCount="indefinite" path="${d}"/></circle>`);}
function bitmap(rows,{s=14,r=4.4,dl=0}={}){let o='',i=0;rows.forEach((row,y)=>[...row].forEach((c,x)=>{if(c==='.')return;o+=`<circle class="d" style="fill:var(${c==='o'?'--accent':'--ink'});--d:${(dl+i++*.012+ (x+y)*.01).toFixed(3)}s" cx="${x*s+s/2}" cy="${y*s+s/2}" r="${r}"/>`;}));return `<svg viewBox="0 0 ${rows[0].length*s} ${rows.length*s}" width="${rows[0].length*s}" height="${rows.length*s}">${o}</svg>`;}

/* ---------- the map ---------- */
const TN={J:'Jönköping',H:'Huskvarna',T:'Tenhult',N:'Nässjö',E:'Eksjö',S:'Sävsjö',V:'Vetlanda'};
const TW={
 J:{x:90,y:110,l:[0,-21,'middle'],g:[-18,5,'end']},
 H:{x:215,y:55,l:[0,-21,'middle'],g:[18,5,'start']},
 T:{x:240,y:190,l:[0,30,'middle'],g:[0,47,'middle']},
 N:{x:380,y:215,l:[0,-20,'middle'],g:[-4,42,'middle']},
 E:{x:535,y:140,l:[0,-21,'middle'],g:[0,-38,'middle']},
 S:{x:175,y:350,l:[0,30,'middle'],g:[-18,5,'end']},
 V:{x:475,y:360,l:[0,30,'middle'],g:[18,5,'start']}};
const ED=[['J','H',8],['J','T',16],['J','S',55],['H','T',12],['T','N',20],['N','E',22],['N','V',45],['N','S',35],['E','V',40],['S','V',30]];
function mapSVG(o={}){const P=o.pos||TW,E=o.edges||ED,keys=Object.keys(P),w=o.vw||600,h=o.vh||410,W=o.w||w;
 let s=`<svg class="map" viewBox="0 0 ${w} ${h}" width="${W}" height="${(W*h/w).toFixed(0)}">`;
 if(o.crow){keys.filter(k=>k!=='V').forEach((k,i)=>{s+=`<g class="crow">${dots(P[k].x,P[k].y,P.V.x,P.V.y,{gap:7,r:1.6,delay:.9+i*.08,step:.008})}</g>`;});}
 E.forEach(([a,b],i)=>{s+=`<g class="edge" data-e="${ek(a,b)}">${dots(P[a].x,P[a].y,P[b].x,P[b].y,{delay:.05+i*.05})}</g>`;});
 if(o.weights!==false)E.forEach(([a,b,km],i)=>{if(km==null)return;const A=P[a],B=P[b],mx=(A.x+B.x)/2,my=(A.y+B.y)/2,L=Math.hypot(B.x-A.x,B.y-A.y);let nx=-(B.y-A.y)/L,ny=(B.x-A.x)/L;if(ny>0){nx=-nx;ny=-ny;}s+=`<text class="w fade" style="--d:${(.5+i*.05).toFixed(2)}s" x="${(mx+nx*13).toFixed(1)}" y="${(my+ny*13).toFixed(1)}">${km}</text>`;});
 keys.forEach((k,i)=>{const p=P[k],l=p.l,g=p.g,tg=(o.tags&&o.tags[k])||'';s+=`<g class="node" data-n="${k}" transform="translate(${p.x},${p.y})"><g class="pop" style="--d:${(.15+i*.06).toFixed(2)}s"><circle class="halo" r="16"/><circle class="core" r="9"/><text class="lbl" x="${l[0]}" y="${l[1]}" style="text-anchor:${l[2]}">${p.name||TN[k]}</text><text class="tag ${o.tagOn&&o.tagOn.includes(k)?'on':''}" x="${g[0]}" y="${g[1]}" style="text-anchor:${g[2]}">${tg}</text></g></g>`;});
 return s+'</svg>';}

function tableStep(el,s,n){$$('tr[data-r]',el).forEach(tr=>{const r=+tr.dataset.r;tr.classList.toggle('on',r<s);tr.classList.toggle('now',r===s-1);});$$('.onfin',el).forEach(x=>x.classList.toggle('on',s===n));const sl=$('.stepl',el);if(sl){sl.innerHTML=(s===0?'Tryck <kbd>→</kbd> för att starta':`Steg ${s} av ${n}`)+`<span class="sdots">${Array.from({length:n},(_,i)=>`<i class="${i<s?'on':''}"></i>`).join('')}</span>`;}}
function mapStep(el,s,A){const svg=$('svg.map',el),st=A.steps,n=st.length,exp=new Set(),disc=new Set(['J']);for(let i=0;i<s;i++){exp.add(st[i].exp);disc.add(st[i].exp);st[i].front.forEach(f=>disc.add(f));}
 const front=new Set(s?st[s-1].front:[]),fin=s===n,cur=s?st[s-1].exp:null;

 return `${hdr('Kapitel 6 · Exempel','Det händer på riktigt')}<div class="abs" style="left:72px;top:190px;width:1136px;display:grid;grid-template-columns:repeat(3,1fr);gap:24px">${C.map((c,i)=>`<div class="card rise" style="--d:${.15+i*.12}s"><div style="height:175px;display:flex;align-items:center;justify-content:center">${c[0]}</div><div class="k" style="margin-top:18px">${c[1]}</div><p style="font-size:17px;line-height:25px;margin:8px 0 0">${c[2]}</p></div>`).join('')}</div>`;}},

/* ---------- engine ---------- */
const stage=$('#stage'),host=$('#slide'),dotsEl=$('#dots');let cur=0,step=0,busy=false,cleanup=[],theme=localStorage.getItem('sok-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
S.forEach((s,i)=>{const b=document.createElement('button');b.title=`${i+1}. ${s.title}`;b.setAttribute('aria-label',`Bild ${i+1}: ${s.title}`);if(i&&S[i-1].sec!==s.sec)b.className='gap';b.onclick=e=>{e.stopPropagation();go(i,i>cur?1:-1);};dotsEl.appendChild(b);});
function fit(){K=Math.min(innerWidth/1280,innerHeight/720);stage.style.setProperty('--k',K);}
function pal(){const dark=(theme==='dark')!==!!S[cur].inv;document.body.className=dark?'pal-dark':'pal-light';}
function bar(){[...dotsEl.children].forEach((b,i)=>{b.classList.toggle('past',i<cur);b.classList.toggle('now',i===cur);b.setAttribute('aria-current',i===cur?'step':'false');});$('#count').textContent=`${String(cur+1).padStart(2,'0')} / ${S.length}`;$('#sec').textContent=SEC[S[cur].sec];}
function render(){cleanup.forEach(f=>{try{f()}catch(e){}});cleanup=[];const sl=S[cur];pal();host.innerHTML=`<section class="slide" aria-label="${sl.title}">${sl.html()}</section>`;const el=host.firstElementChild;if(sl.enter){const c=sl.enter(el);if(c)cleanup.push(c);}if(sl.step)sl.step(el,step);bar();try{history.replaceState(null,'','#'+(cur+1));}catch(e){}}
function wipe(dir,mid,done){if(reduce){mid();done();return;}const c=$('#wipe'),x=setup(c,1280,720),col=cssv('--ink'),G=36,cols=Math.ceil(1280/G)+1,rows=Math.ceil(720/G)+1,maxR=G*.74,T=330;let t0=performance.now(),ph=0;
 const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
 const f=now=>{const t=(now-t0)/T;x.clearRect(0,0,1280,720);x.fillStyle=col;x.beginPath();for(let i=0;i<cols;i++){const dx=dir>0?i/cols:1-i/cols;for(let j=0;j<rows;j++){const dl=dx*.55+((j*7+i*3)%5)/5*.12;let p=Math.max(0,Math.min(1,(t-dl)/.45));p=ease(p);const r=(ph?1-p:p)*maxR;if(r<=.2)continue;const cx=i*G,cy=j*G;x.moveTo(cx+r,cy);x.arc(cx,cy,r,0,6.283);}}x.fill();
  if(t<1.12)requestAnimationFrame(f);else if(!ph){ph=1;t0=now;mid();requestAnimationFrame(f);}else{x.clearRect(0,0,1280,720);done();}};requestAnimationFrame(f);}
function go(i,dir=1,atEnd=false){if(i<0||i>=S.length||i===cur&&!atEnd||busy)return;busy=true;wipe(dir,()=>{cur=i;step=atEnd?(S[i].steps||0):0;render();},()=>busy=false);}
function next(){if(busy)return;const sl=S[cur];if(step<(sl.steps||0)){step++;sl.step(host.firstElementChild,step);}else go(cur+1,1);}
function prev(){if(busy)return;const sl=S[cur];if(step>0){step--;sl.step(host.firstElementChild,step);}else go(cur-1,-1,true);}
addEventListener('keydown',e=>{if(e.metaKey||e.ctrlKey||e.altKey)return;const k=e.key;if(['ArrowRight','ArrowDown','PageDown',' ','Enter'].includes(k)){if(k==='Enter'&&e.target.tagName==='BUTTON')return;e.preventDefault();next();}else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(k)){e.preventDefault();prev();}else if(k==='Home')go(0,-1);else if(k==='End')go(S.length-1,1);else if(k==='f'||k==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen().catch(()=>{});}else if(k==='t'||k==='T')toggleTheme();});
function toggleTheme(){theme=theme==='dark'?'light':'dark';try{localStorage.setItem('sok-theme',theme);}catch(e){}render();}
$('#theme').onclick=e=>{e.stopPropagation();toggleTheme();};$('#prev').onclick=e=>{e.stopPropagation();prev();};$('#next').onclick=e=>{e.stopPropagation();next();};
let px=null;stage.addEventListener('pointerdown',e=>{px=[e.clientX,e.clientY];});stage.addEventListener('pointerup',e=>{if(!px||e.target.closest('button,a'))return;const dx=e.clientX-px[0];px=null;if(Math.abs(dx)>50){dx<0?next():prev();}else next();});
let rt;addEventListener('resize',()=>{fit();clearTimeout(rt);rt=setTimeout(render,250);});
addEventListener('hashchange',()=>{const n=parseInt(location.hash.slice(1))-1;if(n>=0&&n<S.length&&n!==cur)go(n,n>cur?1:-1);});
fit();const h=parseInt(location.hash.slice(1));if(h>=1&&h<=S.length)cur=h-1;render();
})();
