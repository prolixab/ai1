<title>Är det AI?</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700;800&family=Inter:wght@400;500&display=swap">
<style>
/* ── Tokens ─────────────────────────────── */
:root {
  --bg:#0D1117; --surface:#161B22; --surface2:#21262D; --border:#30363D;
  --text:#E6EDF3; --muted:#8B949E;
  --violet:#9B6DFF; --violet-dim:rgba(155,109,255,.15); --violet-glow:rgba(155,109,255,.35);
  --green:#3FFFA0;  --green-dim:rgba(63,255,160,.15);
  --red:#FF6B6B;    --red-dim:rgba(255,107,107,.15);
  --amber:#FFB627;
  --fh:'Space Grotesk',system-ui,sans-serif;
  --fb:'Inter',system-ui,sans-serif;
  --r:14px;
}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#F0EDF8; --surface:#FFFFFF; --surface2:#EBE6F7; --border:#D4C9EE;
  --text:#1A1035; --muted:#6B5EA8;
  --violet:#7C3AED; --violet-dim:rgba(124,58,237,.12); --violet-glow:rgba(124,58,237,.3);
  --green:#0A7848; --green-dim:rgba(10,120,72,.12);
  --red:#DC2626;   --red-dim:rgba(220,38,38,.12);
}}
:root[data-theme="light"]{
  --bg:#F0EDF8; --surface:#FFFFFF; --surface2:#EBE6F7; --border:#D4C9EE;
  --text:#1A1035; --muted:#6B5EA8;
  --violet:#7C3AED; --violet-dim:rgba(124,58,237,.12); --violet-glow:rgba(124,58,237,.3);
  --green:#0A7848; --green-dim:rgba(10,120,72,.12);
  --red:#DC2626;   --red-dim:rgba(220,38,38,.12);
}
:root[data-theme="dark"]{
  --bg:#0D1117; --surface:#161B22; --surface2:#21262D; --border:#30363D;
  --text:#E6EDF3; --muted:#8B949E;
  --violet:#9B6DFF; --violet-dim:rgba(155,109,255,.15); --violet-glow:rgba(155,109,255,.35);
  --green:#3FFFA0; --green-dim:rgba(63,255,160,.15);
  --red:#FF6B6B;   --red-dim:rgba(255,107,107,.15);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:var(--fb);background:var(--bg);color:var(--text);
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
}

/* ── Header ──────────────────────────────── */
header{
  width:100%;padding:14px 24px;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--border);
  background:var(--surface);
}
.back-link{
  font-size:.8rem;color:var(--muted);text-decoration:none;
  display:flex;align-items:center;gap:5px;
}
.back-link:hover{color:var(--text);}
.header-title{
  font-family:var(--fh);font-weight:700;font-size:1rem;color:var(--text);
}
.theme-btn{
  background:none;border:none;cursor:pointer;font-size:1.1rem;color:var(--muted);
  padding:4px 6px;border-radius:6px;
}
.theme-btn:hover{background:var(--surface2);}

/* ── Main wrapper ────────────────────────── */
main{
  flex:1;width:100%;max-width:600px;
  padding:32px 20px 60px;
  display:flex;flex-direction:column;align-items:center;gap:28px;
}

/* ── Score + progress bar ────────────────── */
.hud{
  width:100%;display:flex;align-items:center;gap:14px;
}
.q-counter{
  font-family:var(--fh);font-size:.85rem;color:var(--muted);white-space:nowrap;
  min-width:56px;
}
.prog-bar{
  flex:1;height:6px;background:var(--surface2);border-radius:99px;overflow:hidden;
}
.prog-fill{
  height:100%;background:var(--violet);border-radius:99px;
  transition:width .4s cubic-bezier(.4,0,.2,1);
}
.score-badge{
  font-family:var(--fh);font-weight:700;font-size:.9rem;
  color:var(--violet);white-space:nowrap;min-width:56px;text-align:right;
}

/* ── Question card ───────────────────────── */
.card-wrap{
  width:100%;perspective:800px;
}
.card{
  width:100%;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:36px 28px 28px;
  display:flex;flex-direction:column;align-items:center;gap:20px;
  transform-origin:center bottom;
  transition:transform .25s cubic-bezier(.34,1.56,.64,1),opacity .2s;
}
.card.entering{animation:cardIn .35s cubic-bezier(.34,1.56,.64,1) forwards;}
@keyframes cardIn{
  from{transform:translateY(18px) rotate(-1.5deg);opacity:0;}
  to{transform:translateY(0) rotate(0);opacity:1;}
}
.card-label{
  font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--violet);font-weight:600;
}
.card-emoji{
  font-size:3.6rem;line-height:1;
  filter:drop-shadow(0 4px 12px var(--violet-glow));
}
.card-name{
  font-family:var(--fh);font-weight:800;font-size:1.65rem;text-align:center;
  line-height:1.2;text-wrap:balance;
}
.card-desc{
  font-size:.85rem;color:var(--muted);text-align:center;line-height:1.6;max-width:420px;
}

/* ── Answer buttons ──────────────────────── */
.btn-row{
  display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;
}
.ans-btn{
  font-family:var(--fh);font-weight:700;font-size:1.05rem;
  padding:16px 10px;border-radius:10px;border:2px solid;cursor:pointer;
  transition:transform .15s,box-shadow .15s,background .15s;
  display:flex;flex-direction:column;align-items:center;gap:4px;
}
.ans-btn .btn-icon{font-size:1.4rem;}
.ans-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px -4px var(--shadow);}
.ans-btn:active{transform:translateY(0);}
.ans-btn.ja{
  background:var(--green-dim);border-color:var(--green);color:var(--green);
  --shadow:var(--green-dim);
}
.ans-btn.nej{
  background:var(--red-dim);border-color:var(--red);color:var(--red);
  --shadow:var(--red-dim);
}
.ans-btn:disabled{pointer-events:none;opacity:.5;}

/* ── Feedback panel ──────────────────────── */
.feedback{
  width:100%;border-radius:10px;padding:18px 20px;
  border:1px solid;
  animation:slideDown .3s cubic-bezier(.34,1.3,.64,1) forwards;
  display:none;gap:12px;flex-direction:column;
}
@keyframes slideDown{
  from{transform:translateY(-8px);opacity:0;}
  to{transform:translateY(0);opacity:1;}
}
.feedback.show{display:flex;}
.feedback.correct{background:var(--green-dim);border-color:var(--green);}
.feedback.wrong  {background:var(--red-dim);  border-color:var(--red);}
.fb-verdict{
  font-family:var(--fh);font-weight:700;font-size:1rem;
  display:flex;align-items:center;gap:8px;
}
.fb-verdict .vc{font-size:1.3rem;}
.feedback.correct .fb-verdict{color:var(--green);}
.feedback.wrong   .fb-verdict{color:var(--red);}
.fb-text{font-size:.87rem;line-height:1.65;color:var(--text);}
.fb-nuance{font-size:.8rem;color:var(--muted);font-style:italic;}

.next-btn{
  font-family:var(--fh);font-weight:700;font-size:.95rem;
  padding:13px 28px;border-radius:8px;border:none;cursor:pointer;
  background:var(--violet);color:#fff;
  transition:opacity .15s,transform .15s;align-self:flex-end;
}
.next-btn:hover{opacity:.88;transform:translateY(-1px);}

/* ── Score pulse ─────────────────────────── */
@keyframes scorePulse{
  0%{transform:scale(1);}
  40%{transform:scale(1.35);}
  100%{transform:scale(1);}
}
.score-badge.pulse{animation:scorePulse .35s ease;}

/* ── End screen ──────────────────────────── */
.end-screen{
  display:none;flex-direction:column;align-items:center;gap:24px;
  width:100%;text-align:center;
}
.end-screen.show{display:flex;}
.end-ring{
  width:140px;height:140px;border-radius:50%;
  border:5px solid var(--violet);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:var(--violet-dim);
  box-shadow:0 0 40px var(--violet-glow);
}
.end-score-num{
  font-family:var(--fh);font-weight:800;font-size:2.8rem;color:var(--violet);
  line-height:1;
}
.end-score-of{font-size:.85rem;color:var(--muted);}
.end-title{font-family:var(--fh);font-weight:800;font-size:1.8rem;line-height:1.2;}
.end-msg{font-size:.95rem;color:var(--muted);max-width:380px;line-height:1.65;}
.retry-btn{
  font-family:var(--fh);font-weight:700;font-size:1rem;
  padding:14px 36px;border-radius:10px;border:2px solid var(--violet);
  background:var(--violet-dim);color:var(--violet);cursor:pointer;
  transition:background .15s,transform .15s;
}
.retry-btn:hover{background:var(--violet);color:#fff;transform:translateY(-2px);}

/* ── Summary ─────────────────────────────── */
.summary{width:100%;display:flex;flex-direction:column;gap:6px;}
.sum-row{
  display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;
  font-size:.8rem;padding:8px 12px;border-radius:8px;
  background:var(--surface);border:1px solid var(--border);
}
.sum-em{font-size:1.1rem;}
.sum-name{color:var(--text);}
.sum-result{font-weight:700;font-size:1rem;}
.sum-result.ok{color:var(--green);}
.sum-result.bad{color:var(--red);}

footer{
  width:100%;padding:14px;text-align:center;
  font-size:.75rem;color:var(--muted);border-top:1px solid var(--border);
  background:var(--surface);
}
footer a{color:var(--muted);text-decoration:none;}
footer a:hover{color:var(--text);}
</style>

<header>
  <a class="back-link" href="../index.html">← Kurssidan</a>
  <span class="header-title">🤖 Är det AI?</span>
  <button class="theme-btn" id="theme-toggle">☀</button>
</header>

<main>
  <!-- HUD -->
  <div class="hud" id="hud">
    <div class="q-counter" id="q-counter">1 / 12</div>
    <div class="prog-bar"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
    <div class="score-badge" id="score-badge">0 p</div>
  </div>

  <!-- Quiz area -->
  <div id="quiz-area" style="width:100%;display:flex;flex-direction:column;gap:16px;">
    <div class="card-wrap">
      <div class="card" id="q-card">
        <div class="card-label">Är det AI?</div>
        <div class="card-emoji" id="q-emoji">🖩</div>
        <div class="card-name" id="q-name">–</div>
        <div class="card-desc" id="q-desc"></div>
        <div class="btn-row">
          <button class="ans-btn ja" id="btn-ja" onclick="answer(true)">
            <span class="btn-icon">✅</span> Ja, AI
          </button>
          <button class="ans-btn nej" id="btn-nej" onclick="answer(false)">
            <span class="btn-icon">❌</span> Nej, inte AI
          </button>
        </div>
      </div>
    </div>

    <div class="feedback" id="feedback">
      <div class="fb-verdict"><span class="vc" id="fb-icon"></span><span id="fb-verdict-text"></span></div>
      <div class="fb-text" id="fb-text"></div>
      <div class="fb-nuance" id="fb-nuance" style="display:none"></div>
      <button class="next-btn" id="next-btn" onclick="nextQuestion()">Nästa →</button>
    </div>
  </div>

  <!-- End screen -->
  <div class="end-screen" id="end-screen">
    <div class="end-ring">
      <div class="end-score-num" id="end-num">0</div>
      <div class="end-score-of" id="end-of">av 12</div>
    </div>
    <div class="end-title" id="end-title">Bra jobbat!</div>
    <div class="end-msg" id="end-msg"></div>
    <button class="retry-btn" onclick="restart()">Försök igen 🔄</button>
    <div class="summary" id="summary"></div>
  </div>
</main>

<footer>
  AI 1 · Erik Dahlbergsgymnasiet · Teknikprogrammet &nbsp;·&nbsp;
  <a href="../index.html">← Tillbaka till kurssidan</a>
</footer>

<script>
/* ── Theme ── */
(function(){
  const s=localStorage.getItem('ai1-theme');
  if(s) document.documentElement.setAttribute('data-theme',s);
  updateBtn();
})();
function isDark(){
  const t=document.documentElement.getAttribute('data-theme');
  return t==='dark'||(t!=='light'&&window.matchMedia('(prefers-color-scheme:dark)').matches);
}
function updateBtn(){document.getElementById('theme-toggle').textContent=isDark()?'☀':'☽';}
document.getElementById('theme-toggle').addEventListener('click',()=>{
  const cur=document.documentElement.getAttribute('data-theme');
  const dark=window.matchMedia('(prefers-color-scheme:dark)').matches;
  document.documentElement.setAttribute('data-theme',
    cur==='dark'?'light':cur==='light'?'dark':dark?'light':'dark');
  localStorage.setItem('ai1-theme',document.documentElement.getAttribute('data-theme'));
  updateBtn();
});

/* ── Questions ── */
const QUESTIONS = [
  {
    emoji:'🖩', name:'Miniräknare', isAI:false,
    desc:'Ett verktyg för matematiska beräkningar.',
    explain:'En miniräknare följer exakta matematiska regler programmerade av en människa. Den lär sig ingenting och anpassar sig aldrig — samma beräkning ger alltid exakt samma svar.',
  },
  {
    emoji:'🎬', name:'Netflix-rekommendationer', isAI:true,
    desc:'Systemet som föreslår vad du ska titta på härnäst.',
    explain:'Netflix använder maskininlärning för att analysera vad miljontals användare tittat på och förutsäga vad just du gillar. Systemet lär sig och förbättras kontinuerligt med mer data.',
  },
  {
    emoji:'🎙️', name:'Siri / Google Assistant', isAI:true,
    desc:'Röststyrda digitala assistenter på mobilen.',
    explain:'Röststyrning använder neurala nätverk för taligenkänning och NLP (natural language processing) för att förstå vad du menar, inte bara vilka ord du sa.',
  },
  {
    emoji:'🌡️', name:'En vanlig termostat', isAI:false,
    desc:'Styr uppvärmningen i ett hus.',
    explain:'En vanlig termostat följer en enkel regel: "om temperaturen sjunker under X, slå på värmen." Inga komplexa beslut, inget lärande — det är ett rent regelbaserat system.',
  },
  {
    emoji:'📧', name:'Spamfilter (Gmail)', isAI:true,
    desc:'Sorterar bort oönskad e-post automatiskt.',
    explain:'Moderna spamfilter tränas på miljontals e-postexempel och lär sig känna igen mönster som indikerar spam. De förbättras med mer data — ett typiskt exempel på maskininlärning.',
  },
  {
    emoji:'♟️', name:'Deep Blue (schackdator, 1997)', isAI:true,
    desc:'IBMs schackdator som besegrade Garry Kasparov.',
    explain:'Deep Blue använde kraftfull sökalgoritm och handprogrammerade strategier — inte maskininlärning. Men den utförde komplexa symboliska resonemang och fattar beslut i ett oöverskådligt rum, vilket de flesta räknar som traditionell AI.',
    nuance:'Obs: Deep Blue är ett gränsfall. Moderna AI-forskare skiljer på "traditionell AI" (sökalgoritmer, regelbaserad) och "machine learning". Båda är AI, men på olika sätt.',
  },
  {
    emoji:'📱', name:'Face ID / Ansiktsigenkänning', isAI:true,
    desc:'Låser upp telefonen med ditt ansikte.',
    explain:'Face ID använder djupa neurala nätverk för att känna igen ditt ansikte i olika ljusförhållanden och vinklar. Det är maskininlärning som körs direkt på din telefon.',
  },
  {
    emoji:'🗺️', name:'GPS — beräkna kortaste väg', isAI:false,
    desc:'Navigationsappar som hittar den snabbaste rutten.',
    explain:'Att beräkna kortaste väg (t.ex. Dijkstras algoritm) är ett deterministiskt matematiskt problem — inte AI. Systemet följer en fast algoritm och lär sig ingenting. Däremot kan trafikprediktioner i moderna GPS-appar använda ML.',
    nuance:'Moderna appar som Google Maps använder ML för trafikprognoser, men själva vägberäkningen är inte AI.',
  },
  {
    emoji:'💬', name:'ChatGPT', isAI:true,
    desc:'En stor språkmodell som för konversationer.',
    explain:'ChatGPT är en stor språkmodell (LLM) tränad på enorma mängder text. Den genererar svar baserat på statistiska mönster den lärt sig — ett av de mest kända exemplen på modern AI.',
  },
  {
    emoji:'⌨️', name:'Autokorrigering (tidiga mobiltelefoner)', isAI:false,
    desc:'Rättade stavfel på gamla knapptelefonerna.',
    explain:'Tidig autokorrigering använde ordlistor och enkla frekvensregler, inte maskininlärning. Systemet kunde bara välja det vanligaste ordet som matchade knapptryckningarna.',
    nuance:'Moderna autokorrigeringssystem (som SwiftKey eller Googles tangentbord) använder faktiskt maskininlärning — men inte de tidiga varianterna.',
  },
  {
    emoji:'🎮', name:'AlphaGo', isAI:true,
    desc:'DeepMinds program som spelar brädspelet Go.',
    explain:'AlphaGo lärde sig spela Go genom reinforcement learning — den spelade miljontals partier mot sig själv och förbättrades utan att mänskliga experter programmerade in strategier. Den besegrade världsmästaren 2016.',
  },
  {
    emoji:'🔥', name:'Brandlarm', isAI:false,
    desc:'Detekterar rök eller hetta och utlöser larm.',
    explain:'Ett brandlarm reagerar på rök eller värme med en enkel sensor och tröskelregel. Det analyserar ingenting, lär sig ingenting och tar inga komplexa beslut — det är ett rent reaktivt system.',
  },
];

/* ── State ── */
let current = 0, score = 0, results = [];
const order = [...Array(QUESTIONS.length).keys()];

function shuffle(arr){ for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];} return arr; }

function loadQuestion(){
  const q = QUESTIONS[order[current]];
  const card = document.getElementById('q-card');
  card.classList.remove('entering');
  void card.offsetWidth; // reflow
  card.classList.add('entering');

  document.getElementById('q-emoji').textContent = q.emoji;
  document.getElementById('q-name').textContent  = q.name;
  document.getElementById('q-desc').textContent  = q.desc;
  document.getElementById('q-counter').textContent = `${current+1} / ${QUESTIONS.length}`;
  document.getElementById('prog-fill').style.width = `${(current/QUESTIONS.length)*100}%`;

  const fb = document.getElementById('feedback');
  fb.className = 'feedback';
  document.getElementById('btn-ja').disabled  = false;
  document.getElementById('btn-nej').disabled = false;
}

function answer(userSaysYes){
  const q   = QUESTIONS[order[current]];
  const ok  = (userSaysYes === q.isAI);
  if(ok){ score++; animateScore(); }

  results.push({q, ok});

  // Disable buttons
  document.getElementById('btn-ja').disabled  = true;
  document.getElementById('btn-nej').disabled = true;

  // Feedback
  const fb = document.getElementById('feedback');
  fb.className = 'feedback show ' + (ok ? 'correct' : 'wrong');
  document.getElementById('fb-icon').textContent        = ok ? '✅' : '❌';
  document.getElementById('fb-verdict-text').textContent= ok
    ? (q.isAI ? 'Rätt! Det är AI.' : 'Rätt! Det är inte AI.')
    : (q.isAI ? 'Fel — det är faktiskt AI.' : 'Fel — det är inte AI.');
  document.getElementById('fb-text').textContent = q.explain;

  const nuance = document.getElementById('fb-nuance');
  if(q.nuance){ nuance.textContent = q.nuance; nuance.style.display=''; }
  else nuance.style.display='none';

  // Last question: change button label
  if(current === QUESTIONS.length - 1)
    document.getElementById('next-btn').textContent = 'Visa resultat →';
}

function animateScore(){
  const badge = document.getElementById('score-badge');
  badge.textContent = score + ' p';
  badge.classList.remove('pulse');
  void badge.offsetWidth;
  badge.classList.add('pulse');
}

function nextQuestion(){
  current++;
  if(current >= QUESTIONS.length){ showEnd(); return; }
  loadQuestion();
}

function showEnd(){
  document.getElementById('quiz-area').style.display = 'none';
  document.getElementById('hud').style.display       = 'none';
  const end = document.getElementById('end-screen');
  end.classList.add('show');

  document.getElementById('end-num').textContent = score;
  document.getElementById('end-of').textContent  = `av ${QUESTIONS.length}`;

  const pct = score / QUESTIONS.length;
  let title, msg;
  if(pct === 1)       { title='Perfekt! 🏆'; msg='Du fick alla rätt! Du har koll på vad AI faktiskt är — och vad det inte är. Många av gränsfall-frågorna brukar lura folk.'; }
  else if(pct >= .83) { title='Imponerande! 🎯'; msg='Nästan perfekt! Gränsfallen är svåra — AI är inte alltid ett ja eller nej-svar, och det syns i dina resultat.'; }
  else if(pct >= .67) { title='Bra jobbat! 👍'; msg='Du har en god grundkänsla för vad AI är. Titta på de du missade — det är ofta i gränsfallen som intressantaste diskussionerna finns.'; }
  else if(pct >= .5)  { title='Halvvägs! 🤔'; msg='AI är ett begrepp med suddiga kanter. Gränsen mellan "smart program" och "AI" är inte alltid tydlig — det är poängen med övningen!'; }
  else                 { title='Testa igen! 💪'; msg='Inte lätt! AI-begreppet är genuint förvirrande — även experter är oense. Läs förklaringarna nedan och prova igen.'; }

  document.getElementById('end-title').textContent = title;
  document.getElementById('end-msg').textContent   = msg;

  // Summary
  const sum = document.getElementById('summary');
  sum.innerHTML = '';
  results.forEach(({q, ok})=>{
    const row = document.createElement('div');
    row.className = 'sum-row';
    row.innerHTML = `<span class="sum-em">${q.emoji}</span><span class="sum-name">${q.name}</span><span class="sum-result ${ok?'ok':'bad'}">${ok?'✓':'✗'}</span>`;
    sum.appendChild(row);
  });
}

function restart(){
  current=0; score=0; results=[];
  shuffle(order);
  document.getElementById('score-badge').textContent = '0 p';
  document.getElementById('end-screen').classList.remove('show');
  document.getElementById('quiz-area').style.display = '';
  document.getElementById('hud').style.display       = '';
  loadQuestion();
}

// Init
shuffle(order);
loadQuestion();
</script>
