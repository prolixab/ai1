<title>Är det AI?</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700;800&family=Inter:wght@400;500&display=swap">
<style>
/* ── Tokens ─────────────────────────────── */
:root {
  --bg:#0D1117; --surface:#161B22; --surface2:#21262D; --border:#30363D;
  --text:#E6EDF3; --muted:#8B949E;
  --violet:#9B6DFF; --violet-dim:rgba(155,109,255,.15); --violet-glow:rgba(155,109,255,.35);
  --green:#3FFFA0;  --green-dim:rgba(63,255,160,.15);
  --red:#FF6B6B;    --red-dim:rgba(255,107,107,.15);
  --amber:#FFB627;
  --fh:'Space Grotesk',system-ui,sans-serif;
  --fb:'Inter',system-ui,sans-serif;
  --r:14px;
}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#F0EDF8; --surface:#FFFFFF; --surface2:#EBE6F7; --border:#D4C9EE;
  --text:#1A1035; --muted:#6B5EA8;
  --violet:#7C3AED; --violet-dim:rgba(124,58,237,.12); --violet-glow:rgba(124,58,237,.3);
  --green:#0A7848; --green-dim:rgba(10,120,72,.12);
  --red:#DC2626;   --red-dim:rgba(220,38,38,.12);
}}
:root[data-theme="light"]{
  --bg:#F0EDF8; --surface:#FFFFFF; --surface2:#EBE6F7; --border:#D4C9EE;
  --text:#1A1035; --muted:#6B5EA8;
  --violet:#7C3AED; --violet-dim:rgba(124,58,237,.12); --violet-glow:rgba(124,58,237,.3);
  --green:#0A7848; --green-dim:rgba(10,120,72,.12);
  --red:#DC2626;   --red-dim:rgba(220,38,38,.12);
}
:root[data-theme="dark"]{
  --bg:#0D1117; --surface:#161B22; --surface2:#21262D; --border:#30363D;
  --text:#E6EDF3; --muted:#8B949E;
  --violet:#9B6DFF; --violet-dim:rgba(155,109,255,.15); --violet-glow:rgba(155,109,255,.35);
  --green:#3FFFA0; --green-dim:rgba(63,255,160,.15);
  --red:#FF6B6B;   --red-dim:rgba(255,107,107,.15);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:var(--fb);background:var(--bg);color:var(--text);
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
}

/* ── Header ── */
header{
  width:100%;padding:14px 24px;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--border);background:var(--surface);
}
.back-link{
  font-size:.8rem;color:var(--muted);text-decoration:none;
  display:flex;align-items:center;gap:5px;
}
.back-link:hover{color:var(--text);}
.header-title{font-family:var(--fh);font-weight:700;font-size:1rem;color:var(--text);}
.theme-btn{
  background:none;border:none;cursor:pointer;font-size:1.1rem;color:var(--muted);
  padding:4px 6px;border-radius:6px;
}
.theme-btn:hover{background:var(--surface2);}

/* ── Shared ── */
main{flex:1;width:100%;max-width:780px;padding:32px 20px 60px;display:flex;flex-direction:column;gap:28px;}

/* ══════════════════════════════════════════
   PHASE 1 — PREDICTION GRID
══════════════════════════════════════════ */
.predict-header{display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center;}
.predict-title{font-family:var(--fh);font-weight:800;font-size:1.7rem;line-height:1.2;}
.predict-sub{font-size:.9rem;color:var(--muted);max-width:460px;line-height:1.65;}
.predict-status{
  display:flex;align-items:center;gap:14px;
  background:var(--surface);border:1px solid var(--border);border-radius:10px;
  padding:10px 18px;
}
.predict-count{font-size:.85rem;color:var(--muted);}
.submit-btn{
  font-family:var(--fh);font-weight:700;font-size:.9rem;
  padding:10px 22px;border-radius:8px;border:none;cursor:pointer;
  background:var(--violet);color:#fff;
  transition:opacity .15s,transform .15s;
}
.submit-btn:disabled{opacity:.35;cursor:not-allowed;}
.submit-btn:not(:disabled):hover{opacity:.88;transform:translateY(-1px);}

/* Grid of prediction cards */
.predict-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:12px;
  width:100%;
}
.pred-card{
  background:var(--surface);border:2px solid var(--border);border-radius:12px;
  padding:16px 14px;display:flex;flex-direction:column;gap:10px;
  transition:border-color .2s;
}
.pred-card.answered-ja  { border-color:var(--green); }
.pred-card.answered-nej { border-color:var(--red); }
.pred-emoji{font-size:2rem;line-height:1;}
.pred-name{font-family:var(--fh);font-weight:700;font-size:.95rem;line-height:1.25;}
.pred-desc{font-size:.78rem;color:var(--muted);line-height:1.5;flex:1;}
.pred-btns{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:2px;}
.pred-btn{
  font-family:var(--fh);font-weight:700;font-size:.78rem;
  padding:8px 4px;border-radius:8px;border:2px solid;cursor:pointer;
  transition:background .15s,transform .1s;
}
.pred-btn:active{transform:scale(.97);}
.pred-btn.ja{background:transparent;border-color:var(--green);color:var(--green);}
.pred-btn.nej{background:transparent;border-color:var(--red);color:var(--red);}
.pred-btn.ja.selected{background:var(--green-dim);}
.pred-btn.nej.selected{background:var(--red-dim);}

/* ══════════════════════════════════════════
   PHASE 2 — RESULTS
══════════════════════════════════════════ */
#phase-results{display:none;}

/* Score ring */
.result-hero{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;}
.end-ring{
  width:130px;height:130px;border-radius:50%;
  border:5px solid var(--violet);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:var(--violet-dim);box-shadow:0 0 40px var(--violet-glow);
}
.end-score-num{font-family:var(--fh);font-weight:800;font-size:2.6rem;color:var(--violet);line-height:1;}
.end-score-of{font-size:.8rem;color:var(--muted);}
.result-title{font-family:var(--fh);font-weight:800;font-size:1.7rem;}
.result-msg{font-size:.92rem;color:var(--muted);max-width:420px;line-height:1.65;}

/* Retry */
.retry-btn{
  font-family:var(--fh);font-weight:700;font-size:.95rem;
  padding:13px 32px;border-radius:10px;border:2px solid var(--violet);
  background:var(--violet-dim);color:var(--violet);cursor:pointer;
  transition:background .15s,transform .15s;
}
.retry-btn:hover{background:var(--violet);color:#fff;transform:translateY(-2px);}

/* Results list */
.results-list{width:100%;display:flex;flex-direction:column;gap:10px;}
.res-card{
  background:var(--surface);border:1px solid var(--border);border-radius:10px;
  padding:16px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;
}
.res-card.res-ok { border-left:3px solid var(--green); }
.res-card.res-bad{ border-left:3px solid var(--red); }
.res-emoji{font-size:1.6rem;line-height:1;padding-top:2px;}
.res-body{display:flex;flex-direction:column;gap:4px;}
.res-name{font-family:var(--fh);font-weight:700;font-size:.95rem;}
.res-explain{font-size:.8rem;color:var(--muted);line-height:1.6;}
.res-nuance{font-size:.75rem;color:var(--muted);font-style:italic;margin-top:2px;}
.res-verdict{
  display:flex;flex-direction:column;align-items:flex-end;gap:4px;
  white-space:nowrap;padding-top:2px;
}
.verdict-chip{
  font-family:var(--fh);font-weight:700;font-size:.78rem;
  padding:3px 10px;border-radius:20px;
}
.verdict-chip.ok { background:var(--green-dim);color:var(--green); }
.verdict-chip.bad{ background:var(--red-dim);color:var(--red); }
.your-answer{font-size:.72rem;color:var(--muted);}

/* ── Footer ── */
footer{
  width:100%;padding:14px;text-align:center;
  font-size:.75rem;color:var(--muted);border-top:1px solid var(--border);
  background:var(--surface);
}
footer a{color:var(--muted);text-decoration:none;}
footer a:hover{color:var(--text);}

@media(max-width:500px){
  .predict-grid{grid-template-columns:1fr;}
  .predict-status{flex-direction:column;gap:8px;}
}
</style>

<header>
  <a class="back-link" href="../index.html">← Kurssidan</a>
  <span class="header-title">🤖 Är det AI?</span>
  <button class="theme-btn" id="theme-toggle">☀</button>
</header>

<main>
  <!-- ── PHASE 1: PREDICTION ── -->
  <div id="phase-predict">
    <div class="predict-header">
      <h1 class="predict-title">Ta ställning — är det AI?</h1>
      <p class="predict-sub">Svara på alla 12 system utan att se rätt svar. Välj <strong>Ja, AI</strong> eller <strong>Nej, inte AI</strong> för varje kort — sedan ser du resultaten.</p>
      <div class="predict-status">
        <span class="predict-count" id="predict-count">0 av 12 besvarade</span>
        <button class="submit-btn" id="submit-btn" disabled onclick="showResults()">Visa resultat →</button>
      </div>
    </div>
    <div class="predict-grid" id="predict-grid"></div>
  </div>

  <!-- ── PHASE 2: RESULTS ── -->
  <div id="phase-results">
    <div class="result-hero">
      <div class="end-ring">
        <div class="end-score-num" id="end-num">0</div>
        <div class="end-score-of" id="end-of">av 12</div>
      </div>
      <div class="result-title" id="result-title"></div>
      <div class="result-msg"   id="result-msg"></div>
      <button class="retry-btn" onclick="restart()">Försök igen 🔄</button>
    </div>
    <div class="results-list" id="results-list"></div>
  </div>
</main>

<footer>
  AI 1 · Erik Dahlbergsgymnasiet · Teknikprogrammet &nbsp;·&nbsp;
  <a href="../index.html">← Tillbaka till kurssidan</a>
</footer>

<script>
/* ── Theme ── */
(function(){
  const s=localStorage.getItem('ai1-theme');
  if(s) document.documentElement.setAttribute('data-theme',s);
  updateBtn();
})();
function isDark(){
  const t=document.documentElement.getAttribute('data-theme');
  return t==='dark'||(t!=='light'&&window.matchMedia('(prefers-color-scheme:dark)').matches);
}
function updateBtn(){document.getElementById('theme-toggle').textContent=isDark()?'☀':'☽';}
document.getElementById('theme-toggle').addEventListener('click',()=>{
  const cur=document.documentElement.getAttribute('data-theme');
  const dark=window.matchMedia('(prefers-color-scheme:dark)').matches;
  document.documentElement.setAttribute('data-theme',
    cur==='dark'?'light':cur==='light'?'dark':dark?'light':'dark');
  localStorage.setItem('ai1-theme',document.documentElement.getAttribute('data-theme'));
  updateBtn();
});

/* ── Questions ── */
const QUESTIONS = [
  {
    emoji:'🖩', name:'Miniräknare', isAI:false,
    desc:'Ett verktyg för matematiska beräkningar.',
    explain:'En miniräknare följer exakta matematiska regler programmerade av en människa. Den lär sig ingenting och anpassar sig aldrig — samma beräkning ger alltid exakt samma svar.',
  },
  {
    emoji:'🎬', name:'Netflix-rekommendationer', isAI:true,
    desc:'Systemet som föreslår vad du ska titta på härnäst.',
    explain:'Netflix använder maskininlärning för att analysera vad miljontals användare tittat på och förutsäga vad just du gillar. Systemet lär sig och förbättras kontinuerligt med mer data.',
  },
  {
    emoji:'🎙️', name:'Siri / Google Assistant', isAI:true,
    desc:'Röststyrda digitala assistenter på mobilen.',
    explain:'Röststyrning använder neurala nätverk för taligenkänning och NLP (natural language processing) för att förstå vad du menar, inte bara vilka ord du sa.',
  },
  {
    emoji:'🌡️', name:'En vanlig termostat', isAI:false,
    desc:'Styr uppvärmningen i ett hus.',
    explain:'En vanlig termostat följer en enkel regel: "om temperaturen sjunker under X, slå på värmen." Inga komplexa beslut, inget lärande — det är ett rent regelbaserat system.',
  },
  {
    emoji:'📧', name:'Spamfilter (Gmail)', isAI:true,
    desc:'Sorterar bort oönskad e-post automatiskt.',
    explain:'Moderna spamfilter tränas på miljontals e-postexempel och lär sig känna igen mönster som indikerar spam. De förbättras med mer data — ett typiskt exempel på maskininlärning.',
  },
  {
    emoji:'♟️', name:'Deep Blue (schackdator, 1997)', isAI:true,
    desc:'IBMs schackdator som besegrade Garry Kasparov.',
    explain:'Deep Blue använde kraftfull sökalgoritm och handprogrammerade strategier — inte maskininlärning. Men den utförde komplexa symboliska resonemang och fattar beslut i ett oöverskådligt rum, vilket de flesta räknar som traditionell AI.',
    nuance:'Obs: Deep Blue är ett gränsfall. Moderna AI-forskare skiljer på "traditionell AI" (sökalgoritmer, regelbaserad) och "machine learning". Båda är AI, men på olika sätt.',
  },
  {
    emoji:'📱', name:'Face ID / Ansiktsigenkänning', isAI:true,
    desc:'Låser upp telefonen med ditt ansikte.',
    explain:'Face ID använder djupa neurala nätverk för att känna igen ditt ansikte i olika ljusförhållanden och vinklar. Det är maskininlärning som körs direkt på din telefon.',
  },
  {
    emoji:'🗺️', name:'GPS — beräkna kortaste väg', isAI:false,
    desc:'Navigationsappar som hittar den snabbaste rutten.',
    explain:'Att beräkna kortaste väg (t.ex. Dijkstras algoritm) är ett deterministiskt matematiskt problem — inte AI. Systemet följer en fast algoritm och lär sig ingenting. Däremot kan trafikprediktioner i moderna GPS-appar använda ML.',
    nuance:'Moderna appar som Google Maps använder ML för trafikprognoser, men själva vägberäkningen är inte AI.',
  },
  {
    emoji:'💬', name:'ChatGPT', isAI:true,
    desc:'En stor språkmodell som för konversationer.',
    explain:'ChatGPT är en stor språkmodell (LLM) tränad på enorma mängder text. Den genererar svar baserat på statistiska mönster den lärt sig — ett av de mest kända exemplen på modern AI.',
  },
  {
    emoji:'⌨️', name:'Autokorrigering (tidiga mobiltelefoner)', isAI:false,
    desc:'Rättade stavfel på gamla knapptelefonerna.',
    explain:'Tidig autokorrigering använde ordlistor och enkla frekvensregler, inte maskininlärning. Systemet kunde bara välja det vanligaste ordet som matchade knapptryckningarna.',
    nuance:'Moderna autokorrigeringssystem (som SwiftKey eller Googles tangentbord) använder faktiskt maskininlärning — men inte de tidiga varianterna.',
  },
  {
    emoji:'🎮', name:'AlphaGo', isAI:true,
    desc:'DeepMinds program som spelar brädspelet Go.',
    explain:'AlphaGo lärde sig spela Go genom reinforcement learning — den spelade miljontals partier mot sig själv och förbättrades utan att mänskliga experter programmerade in strategier. Den besegrade världsmästaren 2016.',
  },
  {
    emoji:'🔥', name:'Brandlarm', isAI:false,
    desc:'Detekterar rök eller hetta och utlöser larm.',
    explain:'Ett brandlarm reagerar på rök eller värme med en enkel sensor och tröskelregel. Det analyserar ingenting, lär sig ingenting och tar inga komplexa beslut — det är ett rent reaktivt system.',
  },
];

/* ── State ── */
const userAnswers = new Array(QUESTIONS.length).fill(null); // true=ja, false=nej, null=ej svarad

/* ── Build prediction grid ── */
function buildGrid() {
  const grid = document.getElementById('predict-grid');
  QUESTIONS.forEach((q, i) => {
    const card = document.createElement('div');
    card.className = 'pred-card';
    card.id = `pred-${i}`;
    card.innerHTML = `
      <div class="pred-emoji">${q.emoji}</div>
      <div class="pred-name">${q.name}</div>
      <div class="pred-desc">${q.desc}</div>
      <div class="pred-btns">
        <button class="pred-btn ja" id="ja-${i}" onclick="setPred(${i},true)">✅ Ja, AI</button>
        <button class="pred-btn nej" id="nej-${i}" onclick="setPred(${i},false)">❌ Nej</button>
      </div>`;
    grid.appendChild(card);
  });
}

function setPred(i, val) {
  userAnswers[i] = val;

  // Update button styles
  const jaBtn  = document.getElementById(`ja-${i}`);
  const nejBtn = document.getElementById(`nej-${i}`);
  jaBtn.classList.toggle('selected',  val === true);
  nejBtn.classList.toggle('selected', val === false);

  // Update card border
  const card = document.getElementById(`pred-${i}`);
  card.classList.toggle('answered-ja',  val === true);
  card.classList.toggle('answered-nej', val === false);

  // Update counter + submit button
  const answered = userAnswers.filter(v => v !== null).length;
  document.getElementById('predict-count').textContent = `${answered} av ${QUESTIONS.length} besvarade`;
  document.getElementById('submit-btn').disabled = answered < QUESTIONS.length;
}

/* ── Show Results ── */
function showResults() {
  let score = 0;
  const list = document.getElementById('results-list');
  list.innerHTML = '';

  QUESTIONS.forEach((q, i) => {
    const userSaidYes = userAnswers[i];
    const ok = (userSaidYes === q.isAI);
    if (ok) score++;

    const card = document.createElement('div');
    card.className = `res-card ${ok ? 'res-ok' : 'res-bad'}`;

    const userLabel = userSaidYes ? 'Ja, AI' : 'Nej, inte AI';
    const correctLabel = q.isAI ? 'Ja, AI' : 'Nej, inte AI';

    card.innerHTML = `
      <div class="res-emoji">${q.emoji}</div>
      <div class="res-body">
        <div class="res-name">${q.name}</div>
        <div class="res-explain">${q.explain}</div>
        ${q.nuance ? `<div class="res-nuance">${q.nuance}</div>` : ''}
      </div>
      <div class="res-verdict">
        <span class="verdict-chip ${ok ? 'ok' : 'bad'}">${ok ? '✓ Rätt' : '✗ Fel'}</span>
        <span class="your-answer">Du: ${userLabel}</span>
        ${!ok ? `<span class="your-answer">Svar: ${correctLabel}</span>` : ''}
      </div>`;
    list.appendChild(card);
  });

  // Score message
  const pct = score / QUESTIONS.length;
  let title, msg;
  if(pct === 1)       { title='Perfekt! 🏆'; msg='Alla rätt! Du har en skarp känsla för vad AI faktiskt innebär — inklusive gränsfallen.'; }
  else if(pct >= .83) { title='Imponerande! 🎯'; msg='Nästan perfekt! Gränsfallen är svåra — AI är inte alltid ett ja eller nej-svar, och det syns i resultaten.'; }
  else if(pct >= .67) { title='Bra jobbat! 👍'; msg='Du har en god grundkänsla för vad AI är. Titta på de du missade — det är ofta i gränsfallen de bästa diskussionerna finns.'; }
  else if(pct >= .5)  { title='Halvvägs! 🤔'; msg='AI är ett begrepp med suddiga kanter. Gränsen mellan "smart program" och "AI" är inte alltid tydlig — det är poängen med övningen!'; }
  else                 { title='Testa igen! 💪'; msg='Inte lätt! AI-begreppet är genuint förvirrande — även experter är oense. Läs förklaringarna och prova igen.'; }

  document.getElementById('end-num').textContent   = score;
  document.getElementById('end-of').textContent    = `av ${QUESTIONS.length}`;
  document.getElementById('result-title').textContent = title;
  document.getElementById('result-msg').textContent   = msg;

  document.getElementById('phase-predict').style.display = 'none';
  document.getElementById('phase-results').style.display = '';
}

/* ── Restart ── */
function restart() {
  userAnswers.fill(null);
  document.getElementById('predict-grid').innerHTML = '';
  document.getElementById('predict-count').textContent = '0 av 12 besvarade';
  document.getElementById('submit-btn').disabled = true;
  document.getElementById('phase-results').style.display = 'none';
  document.getElementById('phase-predict').style.display  = '';
  buildGrid();
}

/* ── Init ── */
buildGrid();
</script>
